# Push a tag like v2.1.0 and this builds the portable exe and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable exe
        run: dotnet publish FocusGlance/FocusGlance.csproj -c Release -o publish

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash publish/Focus-with-a-glance.exe -Algorithm SHA256).Hash | Out-File publish/SHA256.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: Focus-with-a-glance
          path: |
            publish/Focus-with-a-glance.exe
            publish/SHA256.txt

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Focus-with-a-glance.exe
            publish/SHA256.txt
          generate_release_notes: true
